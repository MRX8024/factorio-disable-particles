[mod-setting-name]
dp-mode=Particles to disable
dp-entity-car=Car effects
dp-entity-rocket=Rocket effects
dp-entity-bullet=Bullet effects
dp-entity-railgun=Railgun effects
dp-entity-asteroid=Asteroid effects
dp-entity-ejected-item=Ejected item effects

[mod-setting-description]
dp-mode=Checked below - only the ticked particles. All - every listed particle, ignoring the checkboxes. None - nothing from the list.
dp-entity-car=No explosion, wreck, damage sparks, corpse
dp-entity-rocket=No launch flash or smoke trail, and no explosion, scorchmark or tile effects on impact.
dp-entity-bullet=No muzzle flash or hit sparks for firearm, piercing and uranium rounds.
dp-entity-railgun=No muzzle flash or beam smoke.
dp-entity-asteroid=No explosion when an asteroid or a chunk is destroyed.
dp-entity-ejected-item=Items inserted out of a space platform disappear after 1 tick instead of 25 seconds.

[string-mod-setting]
dp-mode-custom=Checked below
dp-mode-all=All
dp-mode-none=None
